[build]
  # Static site - data is already committed to git
  # Run 'npm run sync-notion' locally when Notion content changes
  command = "echo 'Static site - no build needed'"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# Redirects for SPA-style navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
