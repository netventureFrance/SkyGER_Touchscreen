# Netlify Configuration
# Sky Touchscreen Visualisierung

[build]
  # No build command needed - version is incremented by pre-commit hook
  command = "echo 'Deploying version'"

  # Publish Directory
  publish = "."

  # Functions Directory
  functions = "netlify/functions"

# Environment Variables (werden in Netlify UI gesetzt)
[build.environment]
  NODE_VERSION = "18"

# Headers für Security und Caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none';"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Development Settings
[dev]
  command = "echo 'Dev server ready'"
  port = 8888
  targetPort = 3000
  autoLaunch = false

# Functions Configuration
[functions]
  # Node.js bundling
  node_bundler = "esbuild"

  # Included files
  included_files = ["netlify/functions/**"]
