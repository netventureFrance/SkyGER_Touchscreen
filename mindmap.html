<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Sport Touchscreen - Mindmap</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/mindmap.css">
</head>
<body>
    <!-- Gepunktetes Hintergrundmuster -->
    <div class="dot-pattern"></div>

    <!-- Eckrahmen UI-Elemente -->
    <div class="corner-frame top-left"></div>
    <div class="corner-frame top-right"></div>
    <div class="corner-frame bottom-left"></div>
    <div class="corner-frame bottom-right"></div>

    <!-- Header mit View Toggle -->
    <header class="mindmap-header">
        <div class="header-left">
            <a href="index.html" class="logo-link">
                <span class="logo-text-sky">sky</span>
                <span class="logo-text-sport">sport</span>
            </a>
        </div>
        <div class="header-center">
            <h1 class="page-title">Mindmap</h1>
        </div>
        <div class="header-right">
            <div class="view-toggle">
                <a href="index.html" class="toggle-btn" title="Radiale Ansicht">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="4"/>
                        <line x1="12" y1="2" x2="12" y2="6"/>
                        <line x1="12" y1="18" x2="12" y2="22"/>
                        <line x1="2" y1="12" x2="6" y2="12"/>
                        <line x1="18" y1="12" x2="22" y2="12"/>
                    </svg>
                </a>
                <a href="tree.html" class="toggle-btn" title="Baum Ansicht">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                </a>
                <a href="mindmap.html" class="toggle-btn active" title="Mindmap Ansicht">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <line x1="12" y1="9" x2="12" y2="2"/>
                        <line x1="12" y1="22" x2="12" y2="15"/>
                        <line x1="9" y1="12" x2="2" y2="12"/>
                        <line x1="22" y1="12" x2="15" y2="12"/>
                        <line x1="9.5" y1="9.5" x2="5" y2="5"/>
                        <line x1="19" y1="19" x2="14.5" y2="14.5"/>
                        <line x1="9.5" y1="14.5" x2="5" y2="19"/>
                        <line x1="19" y1="5" x2="14.5" y2="9.5"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <!-- Mindmap Controls -->
    <div class="mindmap-controls">
        <button class="control-btn" id="expandAllBtn" title="Alle aufklappen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 3 21 3 21 9"/>
                <polyline points="9 21 3 21 3 15"/>
                <line x1="21" y1="3" x2="14" y2="10"/>
                <line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
            <span>Expand All</span>
        </button>
        <button class="control-btn" id="collapseAllBtn" title="Alle zuklappen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="4 14 10 14 10 20"/>
                <polyline points="20 10 14 10 14 4"/>
                <line x1="14" y1="10" x2="21" y2="3"/>
                <line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
            <span>Collapse All</span>
        </button>
        <button class="control-btn" id="centerBtn" title="Zentrieren">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>Center</span>
        </button>
        <div class="zoom-controls">
            <button class="control-btn icon-only" id="zoomOutBtn" title="Verkleinern">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    <line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
            </button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button class="control-btn icon-only" id="zoomInBtn" title="Vergrößern">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    <line x1="11" y1="8" x2="11" y2="14"/>
                    <line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
            </button>
        </div>
        <div class="screenshot-controls">
            <button class="control-btn screenshot-btn" id="toggleScreenshotBtn" title="Screenshot ein-/ausblenden">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <span>Screenshot</span>
            </button>
            <button class="control-btn notion-btn" id="loadNotionBtn" title="Notion Daten laden">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22 6 12 13 2 6"/>
                </svg>
                <span>Notion</span>
            </button>
        </div>
    </div>

    <!-- Main Mindmap Container -->
    <main class="mindmap-main">
        <div class="mindmap-viewport" id="mindmapViewport">
            <div class="mindmap-canvas" id="mindmapCanvas">
                <!-- SVG für Verbindungslinien -->
                <svg class="mindmap-lines" id="mindmapLines"></svg>
                <!-- Nodes werden via JS generiert -->
                <div class="mindmap-nodes" id="mindmapNodes"></div>
            </div>
        </div>

        <!-- Screenshot Preview Overlay -->
        <div class="screenshot-preview" id="screenshotPreview">
            <div class="screenshot-container">
                <img id="screenshotImage" src="" alt="Screenshot">
                <div class="screenshot-label" id="screenshotLabel"></div>
            </div>
        </div>
    </main>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip"></div>

    <!-- Detail Panel (Slide-in) -->
    <aside class="detail-panel" id="detailPanel">
        <button class="panel-close" id="panelClose">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
        <div class="panel-content" id="panelContent"></div>
    </aside>

    <!-- Footer Info -->
    <footer class="footer-info">
        <span class="status-indicator"></span>
        <span>Sky Touchscreen Dokumentation</span>
        <span class="separator">|</span>
        <span>Mindmap View</span>
        <span class="separator">|</span>
        <span id="currentTime"></span>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/notion-data-loader.js"></script>
    <script src="js/mindmap.js"></script>
    <script>
        // Screenshot Preview State
        let screenshotVisible = false;
        let currentScreenshot = null;
        let notionData = null;

        // Toggle Screenshot Button
        document.getElementById('toggleScreenshotBtn').addEventListener('click', function() {
            const preview = document.getElementById('screenshotPreview');
            const btn = this;

            if (!currentScreenshot) {
                // Kein Screenshot geladen - versuche aus Notion zu laden
                if (notionData && notionData.length > 0) {
                    // Finde das erste Element mit Screenshot (z.B. "Home" oder Root)
                    const itemWithScreenshot = notionData.find(item =>
                        item.screenshots && item.screenshots.length > 0
                    );
                    if (itemWithScreenshot) {
                        showScreenshot(itemWithScreenshot.screenshots[0], itemWithScreenshot.label);
                    } else {
                        btn.querySelector('span').textContent = 'Kein Bild';
                        setTimeout(() => btn.querySelector('span').textContent = 'Screenshot', 2000);
                    }
                } else {
                    btn.querySelector('span').textContent = 'Notion laden!';
                    setTimeout(() => btn.querySelector('span').textContent = 'Screenshot', 2000);
                }
                return;
            }

            screenshotVisible = !screenshotVisible;

            if (screenshotVisible) {
                preview.classList.add('visible');
                btn.classList.add('active');
            } else {
                preview.classList.remove('visible');
                btn.classList.remove('active');
            }
        });

        // Show Screenshot Function
        function showScreenshot(screenshot, label) {
            const preview = document.getElementById('screenshotPreview');
            const img = document.getElementById('screenshotImage');
            const labelEl = document.getElementById('screenshotLabel');
            const btn = document.getElementById('toggleScreenshotBtn');

            currentScreenshot = screenshot;
            img.src = screenshot.url;
            labelEl.textContent = label || screenshot.name || 'Screenshot';

            screenshotVisible = true;
            preview.classList.add('visible');
            btn.classList.add('active');
        }

        // Hide Screenshot Function
        function hideScreenshot() {
            const preview = document.getElementById('screenshotPreview');
            const btn = document.getElementById('toggleScreenshotBtn');

            screenshotVisible = false;
            preview.classList.remove('visible');
            btn.classList.remove('active');
        }

        // Load Notion Data Button
        document.getElementById('loadNotionBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.querySelector('span').textContent = 'Lädt...';

            try {
                notionData = await notionDataLoader.loadAll();
                btn.classList.add('active');
                btn.querySelector('span').textContent = 'Notion ✓';

                // Automatisch erstes Screenshot laden wenn vorhanden
                const itemWithScreenshot = notionData.find(item =>
                    item.screenshots && item.screenshots.length > 0
                );
                if (itemWithScreenshot) {
                    currentScreenshot = itemWithScreenshot.screenshots[0];
                    document.getElementById('screenshotImage').src = currentScreenshot.url;
                    document.getElementById('screenshotLabel').textContent = itemWithScreenshot.label;
                }

                console.log('Notion Daten geladen:', notionData.length, 'Elemente');
            } catch (error) {
                console.error('Fehler:', error);
                btn.querySelector('span').textContent = 'Fehler!';
                setTimeout(() => btn.querySelector('span').textContent = 'Notion', 2000);
            }

            btn.disabled = false;
        });

        // Close screenshot on ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && screenshotVisible) {
                hideScreenshot();
            }
        });

        // Click on screenshot to close
        document.getElementById('screenshotPreview').addEventListener('click', function(e) {
            if (e.target === this) {
                hideScreenshot();
            }
        });
    </script>
</body>
</html>
