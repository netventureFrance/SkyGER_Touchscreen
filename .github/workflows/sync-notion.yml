name: Sync Notion Content
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd mcp-notion-server && npm install
      - run: |
          echo "NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}" > .env
          echo "NOTION_PAGE_ID=${{ secrets.NOTION_PAGE_ID }}" >> .env
      - run: node mcp-notion-server/sync-notion.js
      - run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "Sync Notion content (automated)"
          git push
